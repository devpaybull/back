services:
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1y
    ports:
      - '9428:9428'
    volumes:
      - victoria-logs-data:/victoria-logs-data
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data
    environment:
      MINIO_ROOT_USER: paybull-local
      MINIO_ROOT_PASSWORD: paybull-local-secret
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
  victoria-logs-data:
