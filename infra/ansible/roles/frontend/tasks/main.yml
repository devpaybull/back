---
- name: Install the front deploy script
  ansible.builtin.template:
    src: deploy-front.sh.j2
    dest: "{{ paybull_root }}/deploy-front.sh"
    owner: "{{ paybull_deploy_user }}"
    group: "{{ paybull_deploy_user }}"
    mode: "0750"
  register: frontend_script

- name: Check whether the front was built before
  ansible.builtin.stat:
    path: "{{ paybull_root }}/front/index.html"
  register: frontend_index

- name: Build and publish the front
  ansible.builtin.command: "{{ paybull_root }}/deploy-front.sh"
  become: true
  become_user: "{{ paybull_deploy_user }}"
  when: sources_front_checkout is changed or frontend_script is changed or not frontend_index.stat.exists
  changed_when: true
