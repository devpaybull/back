---
- name: Install Docker and the compose plugin from the Ubuntu archive
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the deploy user run Docker
  ansible.builtin.user:
    name: "{{ paybull_deploy_user }}"
    groups: docker
    append: true
