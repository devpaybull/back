---
- name: Refuse to lock SSH without a deploy key
  ansible.builtin.assert:
    that: paybull_deploy_authorized_keys | length > 0
    fail_msg: Set paybull_deploy_authorized_keys, or root and password logins would lock you out.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - rsync
      - git
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ paybull_deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Authorize the deploy keys
  ansible.posix.authorized_key:
    user: "{{ paybull_deploy_user }}"
    key: "{{ paybull_deploy_authorized_keys | join('\n') }}"
    exclusive: true

- name: Let the deploy user sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ paybull_deploy_user }}"
    content: "{{ paybull_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-paybull.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    mode: "0644"
  notify: Restart ssh

- name: Check the SSH configuration before restarting
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "22", proto: tcp }
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

- name: Deny everything else incoming
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Watch SSH with fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Turn on automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
